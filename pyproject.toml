[project]
name = "shorty"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "django~=5.2",
    "djangorestframework>=3.18.3",
]

[dependency-groups]
dev = [
    "django-stubs>=6.1.2",
    "ruff>=0.17.3",
]

[tool.basedpyright]
typeCheckingMode = "standard"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
